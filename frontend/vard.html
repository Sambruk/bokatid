<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boka tid</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" id="ikon">
<link rel="stylesheet" href="css/style.css" id="stil">
</head>
<body>
<a class="hoppa-till" href="#innehall">Hoppa till innehållet</a>
<header class="topp">
  <div class="omslag topp__rad">
      <div class="topp__vanster">
        <span class="topp__logglank" id="orgLank"></span>
        <a class="topp__app" href="admin" title="Logga in och administrera">Boka tid</a>
      </div>
      <p class="topp__org" id="orgNamn"></p>
      <p class="idag" id="idag"></p>
    </div>
</header>

<main id="innehall">
  <div class="omslag">
    <div class="vard">
      <span id="vardBild"></span>
      <div>
        <h1 id="rubrik">Välj typ av möte</h1>
        <p class="meta" id="vardTitel"></p>
      </div>
    </div>

    <p id="notis" class="notis notis--info" role="status" aria-live="polite" hidden></p>

    <ul class="lista" id="typer"></ul>

    <p id="gruppLank" hidden></p>

    <section id="ansvarSektion" hidden aria-labelledby="ansvarRubrik">
      <h2 id="ansvarRubrik">Ansvarig för</h2>
      <p class="meta">Boka tid om en tjänst eller ett projekt.</p>
      <ul id="ansvar"></ul>
    </section>
  </div>
</main>

<footer><div class="omslag"><a href="./">Alla bokningsbara tider</a> · Öppen källkod · <a href="https://github.com/Sambruk/bokatid">github.com/Sambruk/bokatid</a></div></footer>

<script src="js/gemensamt.js"></script>
<script>
(async () => {
  const delar = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  const vardSlug = delar[delar.length - 1];
  const bas = basvag(1);
  visaIdag(document.getElementById('idag'));
  await visaOrganisation(bas);

  const meddelande = document.getElementById('notis');
  const PLATS = { teams: 'Teams-möte', phone: 'Telefonmöte', physical: 'På plats', other: '' };

  function tjanstLank(t, undertext) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'block';
    a.href = `${bas}/${t.hostSlug}/${t.slug}`;

    const stark = document.createElement('strong');
    stark.textContent = t.title;

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = ` — ${[`${t.duration_min} minuter`, PLATS[t.location_type]].filter(Boolean).join(' · ')}`;
    a.append(stark, meta);

    if (undertext) {
      const rad = document.createElement('span');
      rad.className = 'meta';
      rad.style.display = 'block';
      rad.textContent = undertext;
      a.append(rad);
    }
    li.append(a);
    return li;
  }

  let data;
  let amnen = [];
  try {
    [data, amnen] = await Promise.all([
      hamta(`${bas}/api/oversikt`),
      // Ämnena är ett tillägg: går de inte att hämta visas sidan ändå.
      hamta(`${bas}/api/amnen`).then((d) => d.amnen || [], () => []),
    ]);
  } catch (err) {
    notis(meddelande, `Kunde inte hämta uppgifter: ${err.message}`, 'fel');
    return;
  }

  // Tjänster och projekt där personen är ansvarig i CRM:et.
  const egnaAmnen = amnen
    .filter((a) => a.vardar.some((v) => v.slug === vardSlug))
    .sort((a, b) => a.namn.localeCompare(b.namn, 'sv'));

  // Den som bara bokas via ämnen har inga egna mötestyper och saknas i översikten.
  const somAnsvarig = egnaAmnen[0]?.vardar.find((v) => v.slug === vardSlug);
  const person = (data.personer || []).find((p) => p.slug === vardSlug) ||
    (somAnsvarig && { ...somAnsvarig, eventTypes: [] });
  if (!person) {
    document.getElementById('rubrik').textContent = 'Personen finns inte';
    notis(meddelande, 'Den här personen har inga bokningsbara tider.', 'fel');
    return;
  }

  document.title = `Boka tid med ${person.name}`;
  document.getElementById('rubrik').textContent = `Boka tid med ${person.name}`;
  if (person.title) document.getElementById('vardTitel').textContent = person.title;

  // Samma runda bild som på översikten, så personen känns igen.
  const bildplats = document.getElementById('vardBild');
  if (person.photoUrl) {
    const bild = document.createElement('img');
    bild.className = 'person__bild';
    bild.src = `${bas}/${person.photoUrl}`;
    bild.alt = ''; // Namnet står som rubrik intill.
    bildplats.append(bild);
  } else {
    const initialer = person.name
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map((d) => d[0].toUpperCase())
      .join('');
    const platshallare = document.createElement('span');
    platshallare.className = 'person__bild person__initialer';
    platshallare.setAttribute('aria-hidden', 'true');
    platshallare.textContent = initialer;
    bildplats.append(platshallare);
  }

  const egna = document.getElementById('typer');
  for (const t of person.eventTypes) egna.append(tjanstLank(t));

  /*
   * Gruppbokningarna står samlade på översikten. Här räcker en länk dit — sidan
   * handlar om att boka den här personen, inte om möten som hör till flera.
   */
  const grupp = (data.grupp || []).filter((g) => g.hosts.some((h) => h.slug === vardSlug));
  if (grupp.length) {
    const p = document.getElementById('gruppLank');
    const a = document.createElement('a');
    a.className = 'knapp knapp--enkel';
    a.href = `${bas}/#gruppRubrik`;
    a.textContent = 'Se gruppbokningar';
    p.append(a);
    p.hidden = false;
  }

  if (egnaAmnen.length) {
    const ut = document.getElementById('ansvar');
    for (const a of egnaAmnen) {
      const li = document.createElement('li');
      const lank = document.createElement('a');
      lank.href = `${bas}/om/${a.slug}`;
      lank.textContent = a.namn;
      li.append(lank, document.createTextNode(` (${a.typ.toLowerCase()})`));
      ut.append(li);
    }
    document.getElementById('ansvarSektion').hidden = false;
  }

  if (egnaAmnen.length && !person.eventTypes.length && !grupp.length) {
    // Inget att anmärka: tjänsterna och projekten nedan är vägen att boka.
  } else if (!person.eventTypes.length && !grupp.length) {
    notis(meddelande, 'Den här personen har inga bokningsbara mötestyper just nu.', 'info');
  } else if (!person.eventTypes.length) {
    notis(meddelande, `${person.name} har inga egna mötestyper, men deltar i gruppbokningarna nedan.`, 'info');
  }
})();
</script>
</body>
</html>
