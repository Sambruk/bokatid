<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boka tid</title>
<link rel="stylesheet" href="css/style.css" id="stil">
</head>
<body>
<a class="hoppa-till" href="#innehall">Hoppa till innehållet</a>
<header class="topp">
  <div class="omslag topp__rad">
      <div class="topp__vanster">
        <span class="topp__logglank" id="orgLank"></span>
        <a class="topp__app" href="admin" title="Logga in och administrera">Boka tid</a>
      </div>
      <p class="topp__org" id="orgNamn"></p>
      <p class="idag" id="idag"></p>
    </div>
</header>

<main id="innehall">
  <div class="omslag">
    <h1 id="rubrik">Välj typ av möte</h1>
    <p id="notis" class="notis notis--info" role="status" aria-live="polite" hidden></p>
    <ul class="lista" id="typer"></ul>
  </div>
</main>

<footer><div class="omslag"><a href="./">Alla bokningsbara tider</a> · Öppen källkod · <a href="https://github.com/Sambruk/bokatid">github.com/Sambruk/bokatid</a></div></footer>

<script src="js/gemensamt.js"></script>
<script>
(async () => {
  const delar = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  const vardSlug = delar[delar.length - 1];
  const bas = basvag(1);
  // Sidan kan nås på olika djup, så relativa länkar till css/js sätts om här.
  document.getElementById('stil').href = `${bas}/css/style.css`;
  visaIdag(document.getElementById('idag'));
  await visaOrganisation(bas);

  const meddelande = document.getElementById('notis');
  const ut = document.getElementById('typer');

  try {
    const data = await hamta(`${bas}/api/hosts`);
    const vard = (data.hosts || []).find((v) => v.slug === vardSlug);
    if (!vard) {
      notis(meddelande, 'Den här värden finns inte.', 'fel');
      return;
    }
    document.title = `Boka tid med ${vard.name}`;
    document.getElementById('rubrik').textContent =
      `Boka tid med ${vard.name}${vard.title ? `, ${vard.title}` : ''}`;

    if (!vard.event_types.length) {
      notis(meddelande, 'Den här värden har inga bokningsbara mötestyper just nu.', 'info');
      return;
    }
    for (const typ of vard.event_types) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'block';
      a.href = `${bas}/${vard.slug}/${typ.slug}`;
      const stark = document.createElement('strong');
      stark.textContent = typ.title;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = ` — ${typ.duration_min} minuter`;
      a.append(stark, meta);
      li.append(a);
      ut.append(li);
    }
  } catch (err) {
    notis(meddelande, `Kunde inte hämta uppgifter: ${err.message}`, 'fel');
  }
})();
</script>
</body>
</html>
