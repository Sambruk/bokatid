<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avboka tid</title>
<link rel="stylesheet" href="../css/style.css" id="stil">
</head>
<body>
<a class="hoppa-till" href="#innehall">Hoppa till innehållet</a>
<header class="topp">
  <div class="omslag topp__rad">
      <div class="topp__vanster">
        <span class="topp__logglank" id="orgLank"></span>
        <p class="topp__app">Boka tid</p>
      </div>
      <p class="topp__org" id="orgNamn"></p>
      <p class="idag" id="idag"></p>
    </div>
</header>

<main id="innehall">
  <div class="omslag">
    <h1 id="rubrik">Avboka tid</h1>
    <p id="notis" class="notis notis--info" role="status" aria-live="polite" hidden></p>

    <div class="kort" id="uppgifter" hidden>
      <dl id="detaljer"></dl>
      <form id="formular">
        <label for="orsak">Orsak <span class="hjalptext">(frivilligt, visas för värden)</span></label>
        <textarea id="orsak" style="min-height:4rem"></textarea>
        <p class="rad rad--knappar">
          <button type="submit" class="knapp--fara" id="avbokaknapp">Avboka mötet</button>
        </p>
      </form>
    </div>
  </div>
</main>

<footer><div class="omslag">Öppen källkod · <a href="https://github.com/Sambruk/bokatid">github.com/Sambruk/bokatid</a></div></footer>

<script src="../js/gemensamt.js"></script>
<script>
(async () => {
  const delar = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  const token = delar[delar.length - 1];
  const bas = basvag(2);
  document.getElementById('stil').href = `${bas}/css/style.css`;
  visaIdag(document.getElementById('idag'));
  await visaOrganisation(bas);

  const meddelande = document.getElementById('notis');
  const uppgifter = document.getElementById('uppgifter');

  function rad(dl, rubrik, varde) {
    const dt = document.createElement('dt');
    dt.style.fontWeight = '600';
    dt.textContent = rubrik;
    const dd = document.createElement('dd');
    dd.style.margin = '0 0 0.6rem';
    dd.textContent = varde;
    dl.append(dt, dd);
  }

  let bokning;
  try {
    bokning = await hamta(`${bas}/api/booking/${encodeURIComponent(token)}`);
  } catch (err) {
    notis(meddelande, 'Bokningen finns inte, eller länken är felaktig.', 'fel');
    return;
  }

  const dl = document.getElementById('detaljer');
  rad(dl, 'Möte', bokning.title);
  rad(dl, 'När', bokning.when);
  rad(dl, 'Med', bokning.host.name + (bokning.host.title ? `, ${bokning.host.title}` : ''));
  rad(dl, 'Bokat av', `${bokning.invitee.name} (${bokning.invitee.email})`);
  if (bokning.location) rad(dl, 'Var', bokning.location);
  uppgifter.hidden = false;

  if (bokning.status === 'cancelled') {
    notis(meddelande, 'Det här mötet är redan avbokat.', 'info');
    document.getElementById('formular').hidden = true;
    return;
  }
  if (bokning.inPast) {
    notis(meddelande, 'Mötestiden har redan passerat och kan inte avbokas.', 'info');
    document.getElementById('formular').hidden = true;
    return;
  }

  document.getElementById('formular').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const knapp = document.getElementById('avbokaknapp');
    knapp.disabled = true;
    try {
      await skicka(`${bas}/api/booking/${encodeURIComponent(token)}/cancel`, {
        reason: document.getElementById('orsak').value,
      });
      notis(meddelande, 'Mötet är avbokat. En bekräftelse skickas via e-post.', 'ok');
      document.getElementById('formular').hidden = true;
      document.getElementById('rubrik').textContent = 'Mötet är avbokat';
    } catch (err) {
      notis(meddelande, err.message, 'fel');
      knapp.disabled = false;
    }
  });
})();
</script>
</body>
</html>
